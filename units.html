<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Convert length, temperature, speed, volume, weight and area between US and metric units.">
<link rel="manifest" href="units.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<meta name="apple-mobile-web-app-title" content="Cambio Units">
<title>Convert Units</title>
<style>
  :root {
    --bg: #0a0d12;
    --card: #12161e;
    --card-edge: #1e2530;
    --text: #e6ebf2;
    --muted: #7b8698;
    --cyan: #22d3ee;
    --red: #f87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: calc(12px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 18px;
    padding: 16px 12px 14px; display: flex; flex-direction: column; gap: 12px;
    max-width: 520px; width: 100%; min-width: 0; margin: 0 auto;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px; }
  .card-head h2 { font-size: 1.15rem; }
  .head-right { display: flex; gap: 6px; align-items: center; flex: none; }
  .btn {
    height: 38px; min-width: 44px; padding: 0 12px; font-size: 1.2rem; font-weight: 700; font-family: inherit;
    background: #1a2230; color: var(--text); border: 1px solid #33415a; border-radius: 12px;
    cursor: pointer; touch-action: manipulation;
  }
  .foot { text-align: center; font-size: 0.8rem; color: var(--muted); padding-top: 10px; }
  .foot a { color: var(--muted); text-decoration: none; }

  /* unit converter */
  .conv-pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .conv-pick:empty { display: none; }
  .conv-pick button {
    background: #1a2230; color: var(--text); border: 1px solid #33415a; border-radius: 10px;
    padding: 9px 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit; touch-action: manipulation;
  }
  .conv-list { display: flex; flex-direction: column; gap: 8px; }
  .conv-empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 22px 0; }
  .conv-row { background: #0d1117; border: 1px solid var(--card-edge); border-radius: 12px; padding: 6px; }
  .conv-main { display: grid; grid-template-columns: auto 1fr auto 1fr auto; gap: 4px; align-items: center; }
  .conv-ico { font-size: 1.05rem; line-height: 1; width: 22px; text-align: center; }
  .conv-gauge { vertical-align: -3px; }
  .conv-side { display: flex; align-items: center; gap: 3px; min-width: 0; }
  .conv-side input, .conv-out {
    background: #12161e; border: 1px solid var(--card-edge); border-radius: 8px; color: var(--text);
    font-family: inherit; font-variant-numeric: tabular-nums; min-width: 0; height: 38px;
  }
  /* 16px inputs keep iPhone Safari from zooming in on tap */
  .conv-side input, .conv-out { flex: 1; width: 0; font-size: 16px; font-weight: 700; padding: 0 6px; }
  .conv-out { display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* unit label sized to the chosen unit; the real <select> sits invisibly on top of it */
  .conv-unit {
    position: relative; flex: none; min-width: 38px; height: 38px; padding: 0 7px;
    display: flex; align-items: center; justify-content: center;
    background: #12161e; border: 1px solid var(--card-edge); border-radius: 8px;
    color: var(--muted); font-size: 0.95rem; font-weight: 700; white-space: nowrap;
  }
  .conv-unit select {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    font-size: 16px; border: none; -webkit-appearance: none; appearance: none;
  }
  .conv-unit:focus-within { border-color: #33415a; }
  .conv-side input:focus { outline: none; border-color: #33415a; }
  .conv-swap {
    background: none; border: 1px solid var(--card-edge); border-radius: 50%; width: 32px; height: 32px;
    color: var(--cyan); font-size: 1.05rem; cursor: pointer; touch-action: manipulation; transition: transform 0.2s;
  }
  .conv-swap:active { transform: rotate(180deg); }
  .conv-del {
    background: none; border: none; color: var(--muted); font-size: 1.25rem; font-weight: 700;
    cursor: pointer; width: 22px; height: 38px; line-height: 1; touch-action: manipulation;
  }
  .conv-del:active { color: var(--red); }
  .src { color: var(--muted); font-size: 0.72rem; line-height: 1.5; padding: 0 4px; }
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T83CQZCHBZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-T83CQZCHBZ');
  // one "link_click" event per tap on anything marked data-track

    if (el) gtag('event', 'link_click', { link_name: el.dataset.track, link_url: el.href || '', page: location.pathname });

</head>
<body>

<section class="card">
  <div class="card-head">
    <div><h2>📏 Convert Units 🌡️</h2></div>
    <div class="head-right">
      <button class="btn" id="conv-add" type="button" title="Add a conversion" aria-label="Add a conversion">+</button>
      <button id="menu-btn" title="Menu" aria-label="Menu">☰</button>
    </div>
  </div>
  <div class="conv-pick" id="conv-pick"></div>
  <div class="conv-list" id="conv-list"></div>
  <p class="src">Tap ⇄ to switch direction, − to remove. Inches show to the nearest 1/16 and accept fractions like 3 5/16. Cups, pints, quarts and gallons are US sizes.</p>
</section>
<div class="foot"><a data-track="kofi" href="https://ko-fi.com/jasonhite" target="_blank" rel="noopener">☕ Tip</a> · <a data-track="more_apps" href="index.html#more">⚓ More apps</a></div>
<script src="nav.js"></script>

<script>
const $ = id => document.getElementById(id);
// ---------- unit converter ----------
// Linear units: factor to the category's base unit (m, m/s, L, kg, m²). Temp is special-cased.
// Inches always show as a fraction to the nearest 1/16 (e.g. 3 5/16); everything else 1 decimal.
(function initConverter() {
  const CATS = {
    length: { name: "Length", ico: "📏", def: ["in", "cm"], units: {
      km: ["km", 1000], m: ["m", 1], cm: ["cm", 0.01], mm: ["mm", 0.001],
      mi: ["mi", 1609.344], yd: ["yd", 0.9144], ft: ["ft", 0.3048],
      in: ["in", 0.0254], nmi: ["nmi", 1852] } },
    temp: { name: "Temp", ico: "🌡️", def: ["F", "C"], units: { C: ["°C"], F: ["°F"] } },
    speed: { name: "Speed", ico: "<svg class=\"conv-gauge\" viewBox=\"0 0 20 20\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M3 14 A7.5 7.5 0 1 1 17 14\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M10 4.5v1.5M4.8 7l1 .8M15.2 7l-1 .8\" stroke=\"#e6ebf2\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M10 12.5 L14.2 7.6\" stroke=\"#f87171\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"12.5\" r=\"1.6\" fill=\"#e6ebf2\"/></svg>", def: ["kn", "kmh"], units: {
      kmh: ["km/h", 1 / 3.6], mph: ["mph", 0.44704], kn: ["kn", 1852 / 3600] } },
    volume: { name: "Volume", ico: "🥛", def: ["gal", "L"], units: {
      L: ["L", 1], mL: ["mL", 0.001], gal: ["gal", 3.785411784],
      qt: ["qt", 0.946352946], pt: ["pt", 0.473176473],
      cup: ["cup", 0.2365882365], floz: ["fl oz", 0.0295735295625],
      tbsp: ["tbsp", 0.01478676478125], tsp: ["tsp", 0.00492892159375] } },
    weight: { name: "Weight", ico: "⚖️", def: ["lb", "kg"], units: {
      kg: ["kg", 1], g: ["g", 0.001], lb: ["lb", 0.45359237], oz: ["oz", 0.028349523125] } },
    area: { name: "Area", ico: "📐", def: ["ft2", "m2"], units: {
      m2: ["m²", 1], ft2: ["ft²", 0.09290304], yd2: ["yd²", 0.83612736],
      ha: ["ha", 10000], acre: ["acres", 4046.8564224] } },
  };
  const KEY = "cambio-units";
  let rows;
  try { rows = JSON.parse(localStorage.getItem(KEY) || "null"); } catch { rows = null; }
  // first visit: a few common ones to start with
  if (!Array.isArray(rows)) rows = [
    { cat: "temp", from: "F", to: "C", val: "85" },
    { cat: "length", from: "mi", to: "km", val: "1" },
    { cat: "weight", from: "lb", to: "kg", val: "1" },
    { cat: "volume", from: "gal", to: "L", val: "1" },
  ];
  rows.forEach(r => { if (r.from === "impgal") r.from = "gal"; if (r.to === "impgal") r.to = "gal"; }); // imp gal was removed
  rows = rows.filter(r => CATS[r.cat] && CATS[r.cat].units[r.from] && CATS[r.cat].units[r.to]);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch {} };

  // "3 5/16", "3-5/16", "5/16", "3.25", "1,5" → number
  function parse(s) {
    s = String(s).trim().replace(",", ".").replace(/["″]/g, "");
    if (!s) return NaN;
    const neg = s.startsWith("-") && /\d/.test(s[1] || "");
    if (neg) s = s.slice(1).trim();
    let m = s.match(/^(\d+(?:\.\d+)?)?[\s-]*(?:(\d+)\s*\/\s*(\d+))?$/);
    if (!m || (!m[1] && !m[2])) return NaN;
    let v = (m[1] ? +m[1] : 0) + (m[2] ? +m[2] / +m[3] : 0);
    return neg ? -v : v;
  }
  function fmt(v, unit, dp = 1) {
    if (!isFinite(v)) return "—";
    if (unit === "in") {
      const sign = v < 0 ? "-" : ""; v = Math.abs(v);
      let whole = Math.floor(v), n = Math.round((v - whole) * 16), d = 16;
      if (n === 16) { whole++; n = 0; }
      while (n && n % 2 === 0) { n /= 2; d /= 2; }
      return sign + (n ? (whole ? `${whole} ${n}/${d}` : `${n}/${d}`) : `${whole}`);
    }
    return (+v.toFixed(dp)).toLocaleString("en-US", { maximumFractionDigits: dp });
  }
  // Nautical-mile conversions get 2 decimals (1 nmi = 1.15 mi reads better than 1.2).
  const dpFor = r => (r.from === "nmi" || r.to === "nmi") ? 2 : 1;
  function convert(cat, v, from, to) {
    if (cat === "temp") {
      if (from === to) return v;
      return from === "C" ? v * 9 / 5 + 32 : (v - 32) * 5 / 9;
    }
    const u = CATS[cat].units;
    return v * u[from][1] / u[to][1];
  }

  const list = $("conv-list"), pick = $("conv-pick");
  function render() {
    list.innerHTML = "";
    if (!rows.length) {
      list.innerHTML = `<div class="conv-empty">Tap + to add a conversion</div>`;
      return;
    }
    rows.forEach((r, i) => {
      const cat = CATS[r.cat];
      const opts = sel => Object.entries(cat.units)
        .map(([k, [lbl]]) => `<option value="${k}"${k === sel ? " selected" : ""}>${lbl}</option>`).join("");
      const el = document.createElement("div");
      el.className = "conv-row";
      el.innerHTML = `
        <div class="conv-main">
          <span class="conv-ico" title="${cat.name}">${cat.ico}</span>
          <div class="conv-side">
            <input type="text" inputmode="decimal" class="conv-in" value="${String(r.val ?? "1").replace(/"/g, "&quot;")}">
            <label class="conv-unit"><span>${cat.units[r.from][0]}</span><select class="conv-from" aria-label="From unit">${opts(r.from)}</select></label>
          </div>
          <button class="conv-swap" title="Switch direction">⇄</button>
          <div class="conv-side">
            <div class="conv-out"></div>
            <label class="conv-unit"><span>${cat.units[r.to][0]}</span><select class="conv-to" aria-label="To unit">${opts(r.to)}</select></label>
          </div>
          <button class="conv-del" title="Remove">−</button>
        </div>`;
      const inp = el.querySelector(".conv-in"), out = el.querySelector(".conv-out");
      const calc = () => {
        const v = parse(inp.value);
        out.textContent = isFinite(v) ? fmt(convert(r.cat, v, r.from, r.to), r.to, dpFor(r)) : "—";
        out.title = out.textContent;
        const [fu, tu] = el.querySelectorAll(".conv-unit span");
        fu.textContent = cat.units[r.from][0]; tu.textContent = cat.units[r.to][0];
      };
      inp.addEventListener("input", () => { r.val = inp.value; save(); calc(); });
      el.querySelector(".conv-from").addEventListener("change", e => { r.from = e.target.value; save(); calc(); });
      el.querySelector(".conv-to").addEventListener("change", e => { r.to = e.target.value; save(); calc(); });
      el.querySelector(".conv-swap").addEventListener("click", () => {
        const v = parse(inp.value);
        if (isFinite(v)) r.val = fmt(convert(r.cat, v, r.from, r.to), r.to, dpFor(r)).replace(/,/g, "");
        [r.from, r.to] = [r.to, r.from];
        save(); render();
      });
      el.querySelector(".conv-del").addEventListener("click", () => { rows.splice(i, 1); save(); render(); });
      calc();
      list.appendChild(el);
    });
  }

  $("conv-add").addEventListener("click", () => {
    if (pick.children.length) { pick.innerHTML = ""; return; }
    Object.entries(CATS).forEach(([k, c]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.track = "units_add_" + k;
      b.innerHTML = `${c.ico} ${c.name}`;
      b.addEventListener("click", () => {
        rows.push({ cat: k, from: c.def[0], to: c.def[1], val: "1" });
        pick.innerHTML = ""; save(); render();
        list.lastElementChild?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      });
      pick.appendChild(b);
    });
  });
  render();
})();
</script>
</body>
</html>
