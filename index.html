<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="description" content="Peso exchange rates, charts and cash converter for Americans and Canadians in Mexico.">
<title>Cambio</title>
<style>
  :root { --bg:#0a0d12; --card:#12161e; --edge:#1e2530; --text:#e6ebf2; --muted:#7b8698; --cyan:#22d3ee; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; gap:16px; }
  h1 { font-size:1.8rem; }
  p { color:var(--muted); text-align:center; max-width:340px; }
  a.btn { display:block; width:100%; max-width:340px; padding:22px; border-radius:14px; background:var(--card);
          border:1px solid var(--edge); color:var(--text); text-decoration:none; font-size:1.3rem; font-weight:700; text-align:center; }
  a.btn:active { border-color:var(--cyan); }
  a.btn span { display:block; font-size:.9rem; font-weight:400; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
  <h1>Cambio</h1>
  <p>Live peso rates, 90-day charts and a cash converter.</p>
  <a class="btn" href="usd.html">🇺🇸 US Dollars<span>USD ↔ MXN</span></a>
  <a class="btn" href="cad.html">🇨🇦 Canadian Dollars<span>CAD ↔ MXN</span></a>
</body>
</html>
