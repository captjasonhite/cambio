name: update-surge

on:
  schedule:
    - cron: "*/30 * * * *"   # NHC track (new advisory every 6 h); tide refit once a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python3 -m pip install --quiet numpy
      - name: NHC track + daily tide refit
        run: python3 scripts/fetch_surge.py data
      - name: Commit if changed
        run: |
          git config user.name "cambio-surge-bot"
          git config user.email "cambio-surge-bot@users.noreply.github.com"
          if ! git diff --quiet data/surge.json; then
            git add data/surge.json data/surge.js
            git commit -m "storm surge data $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase
            git push
          else
            echo "no change"
          fi
