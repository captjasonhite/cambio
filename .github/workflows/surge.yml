name: update-surge

on:
  schedule:
    - cron: "30 12 * * *"   # 06:30 CDMX — daily tide refit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python3 -m pip install --quiet numpy
      - name: Refit tides
        run: python3 scripts/fetch_surge.py data
      - name: Commit if changed
        run: |
          git config user.name "cambio-surge-bot"
          git config user.email "cambio-surge-bot@users.noreply.github.com"
          if ! git diff --quiet data/surge.json; then
            git add data/surge.json data/surge.js
            git commit -m "tide fit $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          else
            echo "no change"
          fi
